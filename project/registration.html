<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration - SkillBridge</title>
    <link rel="icon" type="image/png" href="image/logo1.png">
    <link rel="stylesheet" href="css/regi.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body class="auth-body">

<div class="auth-container register-container">
    
    <!-- Left Banner Side -->
    <div class="auth-banner">
        <div class="banner-content">
            <!-- White Circle Wrapper for Logo -->
            <a href="index.html" class="logo">
                <div class="logo-circle">
                    <img src="image/logo1.png" alt="SkillBridge Logo">
                </div>
            </a>
            <h2>Join the SkillBridge Community</h2>
            <p>Create your student account to access structured roadmaps, track skills, and connect with peer networks.</p>
        </div>
    </div>

    <!-- Right Form Side -->
    <div class="auth-form-container">
        
        <div class="auth-header">
            <h2>Student Registration</h2>
            <p>Already registered? <a href="#">Log in here</a></p>
        </div>

        <form class="auth-form" action="#" method="POST">
            
            <!-- Full Name -->
            <div class="form-group">
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" placeholder="Enter your full name" required>
            </div>

            <!-- Roll & Semester -->
            <div class="form-row">
                <div class="form-group">
                    <label for="roll">Roll Number</label>
                    <input type="text" id="roll" placeholder="e.g. 180305" required>
                </div>

                <div class="form-group">
                    <label for="semester">Semester</label>
                    <select id="semester" required>
                        <option value="" disabled selected>Select Semester</option>
                        <option value="1st">1st Semester</option>
                        <option value="2nd">2nd Semester</option>
                        <option value="3rd">3rd Semester</option>
                        <option value="4th">4th Semester</option>
                        <option value="5th">5th Semester</option>
                        <option value="6th">6th Semester</option>
                        <option value="7th">7th Semester</option>
                        <option value="8th">8th Semester</option>
                    </select>
                </div>
            </div>

            <!-- Edu Email & Mobile Number -->
            <div class="form-row">
                <div class="form-group">
                    <label for="edu-email">Edu Email</label>
                    <input type="email" id="edu-email" placeholder="student@varsity.edu.bd" required>
                </div>

                <div class="form-group">
                    <label for="mobile">Mobile Number</label>
                    <input type="tel" id="mobile" placeholder="017XXXXXXXX" pattern="[0-9]{11}" required>
                </div>
            </div>

            <!-- Password & Confirm Password -->
            <div class="form-row">
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Min 8 characters" required>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" placeholder="Repeat password" required>
                </div>
            </div>

            <!-- Terms & Conditions Checkbox -->
            <div class="form-checkbox">
                <input type="checkbox" id="terms" required>
                <label for="terms">I accept the <a href="#">Terms & Conditions</a> and <a href="#">Privacy Policy</a></label>
            </div>

            <!-- Register Button -->
            <button type="submit" class="signup-submit-btn">Register Account</button>

        </form>

        <div class="back-home">
            <a href="index.html">← Back to Home</a>
        </div>

    </div>

</div>

</body>
</html>
