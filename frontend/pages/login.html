<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SkillBridge</title>
    <link rel="icon" type="image/png" href="../assets/images/logo1.png">
    
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/auth.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body class="auth-body">

<div class="auth-container login-container">
    
    <!-- Left Banner Side -->
    <div class="auth-banner">
        <div class="banner-content">
            <a href="index.html" class="logo">
                <div class="logo-circle">
                    <img src="../assets/images/logo1.png" alt="SkillBridge Logo">
                </div>
            </a>
            <h2>Welcome Back to SkillBridge!</h2>
            <p>Log in to access your dashboard, continue your learning roadmaps, and interact with your community.</p>
        </div>
    </div>

    <!-- Right Form Side -->
    <div class="auth-form-container">
        
        <div class="auth-header">
            <h2>Sign In</h2>
            <p>Don't have an account? <a href="register.html">Register here</a></p>
        </div>

        <form class="auth-form" action="#" method="POST">
            <div class="form-group">
                <label for="login-id">Edu Email or Roll Number</label>
                <input type="text" id="login-id" placeholder="Enter your email or roll" required>
            </div>

            <div class="form-group">
                <div class="label-row">
                    <label for="password">Password</label>
                    <a href="#" class="forgot-pass-link">Forgot Password?</a>
                </div>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>

            <div class="form-checkbox">
                <input type="checkbox" id="remember">
                <label for="remember">Remember me for 30 days</label>
            </div>

            <button type="submit" class="signup-submit-btn">Sign In</button>
        </form>

        <div class="back-home">
            <a href="index.html">← Back to Home</a>
        </div>
    </div>
</div>

<script src="../js/login.js"></script>

</body>
</html>
